<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.name }} - 상세 페이지</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: left;
        }
        h1 {
            color: #007bff;
            margin-bottom: 10px;
        }
        .description {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
        }
        .price {
            font-size: 20px;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 10px;
        }
        .date {
            font-size: 13px;
            color: #999;
            margin-bottom: 30px;
        }
        .btn-back {
        display: inline-block;
        color: #007bff;
        text-decoration: none;
        font-size: 14px;
        margin-right: 15px;
    }
    .btn-back:hover {
        text-decoration: underline;
    }

    .btn-edit {
        display: inline-block;
        background-color: #ffc107;
        color: white;
        padding: 8px 16px;
        font-size: 14px;
        text-decoration: none;
        border-radius: 8px;
        transition: background 0.2s ease-in-out;
    }
    .btn-edit:hover {
        background-color: #e0a800;
    }
    .btn-delete {
    display: inline-block;
    background-color: #dc3545;
    color: white;
    padding: 8px 16px;
    font-size: 14px;
    text-decoration: none;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s ease-in-out;
}
.btn-delete:hover {
    background-color: #c82333;
}

</style>
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ product.name }}</h1>
        <p class="description">{{ product.description }}</p>
        <p class="price">{{ product.price|floatformat:0 }} 원</p>
        <p class="date">등록일: {{ product.created_at|date:"Y-m-d H:i" }}</p>

        <a href="/shop" class="btn-back">← 상품 목록으로</a>
        <a href="/shop/{{ product.id }}/edit/" class="btn-edit">수정하기</a>
        <form action="/shop/{{ product.id }}/delete/" method="POST" onsubmit="return confirmDelete();" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="btn-delete">삭제하기</button>
        </form>
    </div>
    <script>
        function confirmDelete() {
            return confirm("정말 삭제하시겠습니까?");
        }
    </script>
</body>
</html>
